# Configuracion del servidor
spring.application.name=ms-documentos-consumer
server.port=8082

# Configuracion de RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Configuracion de listener
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=3000
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Configuracion de exchanges
rabbitmq.exchange.ventas=exchange.ventas
rabbitmq.exchange.dlx=exchange.dlx

# Configuracion de colas
rabbitmq.queue.documentos=cola.documentos
rabbitmq.queue.documentos.dlq=cola.documentos.dlq
rabbitmq.queue.guias=cola.guias

# Configuracion de routing keys
rabbitmq.routing.documento.generar=venta.documento.generar
rabbitmq.routing.error.documento=error.documento

# Logging
logging.level.cl.duoc.asyncorders=DEBUG
logging.level.org.springframework.amqp=DEBUG
