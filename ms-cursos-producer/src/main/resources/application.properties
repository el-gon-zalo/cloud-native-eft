# Configuracion del servidor
spring.application.name=ms-cursos-producer
server.port=8080

# Configuracion de RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Configuracion de exchanges
rabbitmq.exchange.ventas=exchange.ventas
rabbitmq.exchange.notificaciones=exchange.notificaciones
rabbitmq.exchange.dlx=exchange.dlx

# Configuracion de colas
rabbitmq.queue.documentos=cola.documentos
rabbitmq.queue.notificaciones=cola.notificaciones
rabbitmq.queue.documentos.dlq=cola.documentos.dlq
rabbitmq.queue.notificaciones.dlq=cola.notificaciones.dlq

# Configuracion de routing keys
rabbitmq.routing.documento.generar=venta.documento.generar
rabbitmq.routing.notificacion.enviar=venta.notificacion.enviar
rabbitmq.routing.error.documento=error.documento
rabbitmq.routing.error.notificacion=error.notificacion

