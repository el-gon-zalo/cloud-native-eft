# Configuracion de base de datos (H2 embebida para desarrollo)
 spring.datasource.url=jdbc:h2:mem:eftdb;DB_CLOSE_DELAY=-1
 spring.datasource.driver-class-name=org.h2.Driver
 spring.datasource.username=sa
 spring.datasource.password=
 spring.jpa.hibernate.ddl-auto=update
 spring.jpa.show-sql=false
 spring.h2.console.enabled=true

# Configuracion de AWS S3 (guias de despacho)
aws.region=us-east-1
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket=${AWS_S3_BUCKET:bucket-guias-despacho-dev}
# Dejar vacio en AWS real; usar solo para apuntar a LocalStack u otro emulador en local
aws.s3.endpoint=${AWS_S3_ENDPOINT:}

# Logging
logging.level.cl.duoc.asyncorders=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.amqp.rabbit=DEBUG
logging.level.org.springframework.amqp.rabbit.connection=DEBUG
logging.level.com.rabbitmq.client=DEBUG
logging.level.org.springframework.boot.autoconfigure.amqp=DEBUG

# Agregado para cursos

rabbitmq.exchange.cursos=exchange.cursos
rabbitmq.queue.cursos=cola.cursos
rabbitmq.queue.cursos.dlq=cola.cursos.dlq
rabbitmq.routing.curso.documento.generar=curso.documento.generar
rabbitmq.routing.error.curso=error.curso

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/771a4cce-a5f5-47af-9e9c-87edb0022120/v2.0